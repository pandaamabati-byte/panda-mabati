name: Panda Mabati CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/product-image-library

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality checks
        run: npm run check
